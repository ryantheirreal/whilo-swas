name: Whilo One-Time Strix Code Review

on:
  push:
    branches:
      - main
    paths:
      - 'docs/security/strix-assessment-authorized-once.md'

permissions:
  contents: read

jobs:
  strix-code-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the authorized repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Detect Anthropic secret without exposing it
        id: model-secret
        env:
          LLM_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Strix was not run. Add the repository Actions secret ANTHROPIC_API_KEY and re-run by intentionally updating the one-time trigger marker."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned Strix release
        if: steps.model-secret.outputs.available == 'true'
        run: python -m pip install --disable-pip-version-check "strix-agent==1.7.0"

      - name: Run bounded repository-only assessment with Claude
        if: steps.model-secret.outputs.available == 'true'
        env:
          STRIX_LLM: anthropic/claude-sonnet-4-6
          LLM_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: strix --non-interactive --target ./web/whilo-swas --scan-mode quick --max-budget 10

      - name: Require an explicit completed report
        if: ${{ always() && steps.model-secret.outputs.available == 'true' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports = sorted(Path("strix_runs").glob("**/run.json"), key=lambda p: p.stat().st_mtime, reverse=True)
          if not reports:
              raise SystemExit("Strix produced no run.json; the assessment is incomplete, not clean.")
          report = json.loads(reports[0].read_text())
          status = str(report.get("status", "")).lower()
          if status != "completed":
              raise SystemExit(f"Strix report status is {status!r}, not completed.")
          print(f"Completed repository-only assessment: {reports[0]}")
          PY

      - name: Upload the report for maintainer review
        if: ${{ always() && steps.model-secret.outputs.available == 'true' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: whilo-strix-code-only-report
          path: strix_runs/
          if-no-files-found: warn
          retention-days: 7
