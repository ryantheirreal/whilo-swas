name: Strix Authorized Repository Assessment

on:
  workflow_dispatch:
    inputs:
      confirm_authorization:
        description: "I own this repository and authorize a code-only security assessment."
        required: true
        type: boolean
        default: false
      scope:
        description: "Assessment scope (active network targets are deliberately excluded)."
        required: true
        type: choice
        options:
          - repository-code-only
        default: repository-code-only

permissions:
  contents: read

jobs:
  strix:
    if: inputs.confirm_authorization == true && inputs.scope == 'repository-code-only'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout authorized repository source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Require the dedicated model secret
        env:
          LLM_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::Add ANTHROPIC_API_KEY in repository Actions secrets before running Strix."
            exit 1
          fi
      - name: Install pinned Strix release
        run: python -m pip install --disable-pip-version-check "strix-agent==1.7.0"
      - name: Run bounded code-only assessment
        env:
          STRIX_LLM: anthropic/claude-sonnet-4-6
          LLM_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: strix --non-interactive --target ./web/whilo-swas --scan-mode quick --max-budget 10
      - name: Require a completed assessment report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports = sorted(Path("strix_runs").glob("**/run.json"), key=lambda p: p.stat().st_mtime, reverse=True)
          if not reports:
              raise SystemExit("Strix did not produce run.json; this is not a clean assessment.")
          report = json.loads(reports[0].read_text())
          status = str(report.get("status", "")).lower()
          if status != "completed":
              raise SystemExit(f"Strix assessment status is {status!r}, not 'completed'. Treat this run as incomplete.")
          print(f"Completed Strix report: {reports[0]}")
          PY
      - name: Preserve report for maintainer review
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: whilo-strix-report
          path: strix_runs/
          if-no-files-found: warn
          retention-days: 14
